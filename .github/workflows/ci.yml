name: CI

# Runs the same two checks a broken main has slipped past before: a TypeScript
# compile and a full `next build` (which prerenders every post, catching bad
# MDX like an unclosed <Question>/<FAQ> tag). Runs on every PR and on direct
# pushes to main, so either path surfaces a break as a red check in the GitHub
# UI instead of only showing up later as a failed Pages deploy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test generated-MDX sanitizer
        run: npm run test:mdx-sanitize

      - name: Build (prerenders every post — catches malformed MDX)
        run: npm run build
